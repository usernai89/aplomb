<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aplomb</title>
<meta name="description" content="Aplomb : séances de musculation à la maison, routine posture, suivi.">
<meta name="theme-color" content="#F6F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131017" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aplomb">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<style>
/* Mise en page : sur l'accueil, un fil à plomb vertical porte la journée (3h05 → coucher) ; cartes par rôle ; onglets fixes en bas ; séances et routines en plein écran. */
:root{
  --bg:#F6F1EA;--surface:#FFFFFF;--surface-2:#F2ECE4;--ink:#211B29;--muted:#655D70;--line:#E4DBD0;
  --accent:#EE8458;--accent-ink:#A3401A;--on-accent:#2A1006;--accent-soft:rgba(238,132,88,.18);
  --plumb:#4A2D7F;--on-plumb:#FFFFFF;--plumb-soft:rgba(74,45,127,.10);
  --good:#23845A;--good-soft:rgba(35,132,90,.12);--warn:#A85F00;--warn-soft:rgba(168,95,0,.12);--crit:#BF3428;--crit-soft:rgba(191,52,40,.10);
  --ph-fond:#C8BBE6;--ph-constr:#4A2D7F;--ph-dech:#D8CEC3;--ph-int:#EE8458;
  --shadow:0 1px 2px rgba(33,27,41,.05),0 10px 28px rgba(74,45,127,.08);
  --f-display:"Outfit","Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:18px;--nav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131017;--surface:#1D1922;--surface-2:#27212E;--ink:#F0EAF5;--muted:#A99FB5;--line:#372F40;
    --accent:#F4A07A;--accent-ink:#F7B696;--on-accent:#2A1006;--accent-soft:rgba(244,160,122,.16);
    --plumb:#BBA5F2;--on-plumb:#150F1D;--plumb-soft:rgba(187,165,242,.14);
    --good:#56C78F;--good-soft:rgba(86,199,143,.15);--warn:#F2A64B;--warn-soft:rgba(242,166,75,.15);--crit:#F26C5F;--crit-soft:rgba(242,108,95,.15);
    --ph-fond:#5A4888;--ph-constr:#BBA5F2;--ph-dech:#4A4253;--ph-int:#F4A07A;
    --shadow:0 1px 2px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131017;--surface:#1D1922;--surface-2:#27212E;--ink:#F0EAF5;--muted:#A99FB5;--line:#372F40;
  --accent:#F4A07A;--accent-ink:#F7B696;--on-accent:#2A1006;--accent-soft:rgba(244,160,122,.16);
  --plumb:#BBA5F2;--on-plumb:#150F1D;--plumb-soft:rgba(187,165,242,.14);
  --good:#56C78F;--good-soft:rgba(86,199,143,.15);--warn:#F2A64B;--warn-soft:rgba(242,166,75,.15);--crit:#F26C5F;--crit-soft:rgba(242,108,95,.15);
  --ph-fond:#5A4888;--ph-constr:#BBA5F2;--ph-dech:#4A4253;--ph-int:#F4A07A;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html.lock,html.lock body{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{width:100%;max-width:620px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
p{margin:0}
ul,ol{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--plumb);outline-offset:2px}

/* En-tête et onglets */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{display:flex;align-items:center;gap:8px;font:700 26px/1 var(--f-display);letter-spacing:.02em}
.brand svg{width:16px;height:26px;flex:none}
.brand .bob{fill:var(--accent)}
.top-meta{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--muted);text-align:right;line-height:1.3}
.icon-btn{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:var(--nav-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.02em}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--plumb)}
main.wrap{padding-block:18px 8px}

/* Typographie */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.35}
.h1{font:700 40px/1 var(--f-display);margin:4px 0 0;letter-spacing:.005em;text-wrap:balance}
.h1 .of{color:var(--muted);font-weight:600;font-size:.6em;margin-left:2px}
h2,.h2{font:700 25px/1.08 var(--f-display);margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font-size:16px;font-weight:600;margin:0;line-height:1.3}
.lead{color:var(--muted);margin-top:6px;max-width:62ch}
.lead b{color:var(--ink)}
.small{font-size:13.5px}
.muted{color:var(--muted)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.ok-txt{color:var(--good);font-weight:600}
.plain{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.plain li::marker{color:var(--muted)}

/* Structure */
.stack{display:flex;flex-direction:column;gap:14px}
.row-between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.feature{box-shadow:var(--shadow);border-color:transparent}
.sec-head{padding:2px 0 4px}

/* Boutons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;font-weight:600;line-height:1.2;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.plumb{background:var(--plumb);border-color:var(--plumb);color:var(--on-plumb)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row>.btn{flex:1 1 130px}
.link-btn{background:none;border:0;padding:6px 0;color:var(--plumb);font-size:13.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px;align-self:flex-start;display:inline-flex;align-items:center;gap:6px}
.link-btn.danger{color:var(--crit)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;min-width:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.chip[aria-pressed="true"]{background:var(--plumb);border-color:var(--plumb);color:var(--on-plumb)}
.switch{position:relative;flex:none;width:44px;height:26px;border-radius:999px;background:var(--line);transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
[aria-pressed="true"]>.switch{background:var(--plumb)}
[aria-pressed="true"]>.switch::after{transform:translateX(18px)}
.switch-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;background:none;border:0;padding:4px 0;text-align:left}
.switch-row b{display:block;font-weight:600}
.switch-row small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.toggle-line{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;color:var(--muted);font-size:13.5px;font-weight:600;text-align:left;align-self:flex-start}

/* Accueil */
.hero{display:flex;flex-direction:column;gap:2px;padding:2px 0 4px}
.weeks{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.wk-row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;align-items:end;height:20px}
.wk{height:10px;border-radius:3px}
.wk.fut{opacity:.3}
.wk.cur{height:20px;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.p-fond{background:var(--ph-fond)}.p-constr{background:var(--ph-constr)}.p-dech{background:var(--ph-dech)}.p-int{background:var(--ph-int)}
.wk-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.wk-legend span{display:inline-flex;align-items:center;gap:6px}
.wk-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.sess-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sess-letter{font:700 68px/.8 var(--f-display);color:var(--accent);margin-top:4px}
.ex-list{list-style:none;padding:10px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column}
.ex-list li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:4px 0;font-size:14.5px}
.ex-li-n{color:var(--accent-ink);font-weight:700;font-size:17px}
.dayline{--dl-x:73px;list-style:none;padding:0;position:relative;display:flex;flex-direction:column}
.dayline::before{content:"";position:absolute;left:var(--dl-x);top:18px;bottom:22px;width:2px;background:var(--plumb);opacity:.35}
.dayline::after{content:"";position:absolute;left:calc(var(--dl-x) - 6px);bottom:4px;width:14px;height:20px;background:var(--plumb);clip-path:polygon(0 0,100% 0,100% 24%,50% 100%,0 24%)}
.dl{display:grid;grid-template-columns:52px 24px minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:9px 0;min-height:58px}
.dl:last-child{margin-bottom:22px}
.dl-time{font:600 16px/1.1 var(--f-display);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.dl-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--plumb);background:var(--surface);display:grid;place-items:center;position:relative;z-index:1;color:var(--on-plumb)}
.dl.done .dl-dot{background:var(--plumb)}
.dl-body{min-width:0}
.dl-title{font-weight:600;line-height:1.3}
.dl.done .dl-title{color:var(--muted)}
.dl-sub{font-size:13px;color:var(--muted);line-height:1.35}
.tick{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:transparent;display:grid;place-items:center}
.tick[aria-pressed="true"]{background:var(--plumb);border-color:var(--plumb);color:var(--on-plumb)}
.mini-step{display:flex;gap:6px}
.mini-step button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:19px;font-weight:600;line-height:1}
.note-card{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note-card>div{flex:1 1 220px;display:flex;flex-direction:column;gap:4px}
.warn-card{border-color:var(--warn);background:var(--warn-soft)}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--crit-soft)}
.confirm span{flex:1 1 100%;font-size:14px;font-weight:600}
.streak{display:flex;flex-direction:column;align-items:flex-end;text-align:right;flex:none}
.streak b{font:700 34px/1 var(--f-display)}
.streak span{font-size:12px;color:var(--muted)}

/* Listes à cocher */
.checklist{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.check-row{width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;background:var(--surface-2);border:0;border-radius:12px;padding:12px}
.check-row .box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface);color:transparent}
.check-row[aria-pressed="true"] .box{background:var(--plumb);border-color:var(--plumb);color:var(--on-plumb)}
.check-row b{display:block;font-weight:600;line-height:1.35}
.check-row small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.mini-list{list-style:none;padding:10px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.mini-list li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:14px;padding:3px 0}
.mini-list .num{color:var(--accent-ink);font-weight:700;font-size:16px}
.study-n{font:700 64px/1 var(--f-display);margin-top:2px}

/* Séance */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ov-head{flex:none;background:var(--bg);border-bottom:1px solid var(--line)}
.ov-row{display:flex;align-items:center;gap:12px;min-height:58px}
.ov-title{flex:1;min-width:0}
.ov-title h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.elapsed{font:600 22px/1 var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.ov-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ov-body>.wrap{padding-block:16px 28px}
.ov-foot{flex:none;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov-foot>.wrap{padding-block:10px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step-chip{flex:none;min-width:42px;height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--muted)}
.step-chip.done{background:var(--plumb-soft);color:var(--ink);border-color:transparent}
.step-chip.cur{border-color:var(--plumb);color:var(--plumb);box-shadow:inset 0 0 0 1px var(--plumb)}
.ex-top{display:flex;align-items:flex-start;gap:12px}
.ex-n{font:700 30px/1 var(--f-display);color:var(--accent-ink);min-width:30px}
.presc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.presc div{background:var(--surface-2);border-radius:10px;padding:8px 4px;text-align:center;min-width:0}
.presc b{display:block;font:700 21px/1.05 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.presc span{font-size:11.5px;color:var(--muted)}
.cue-l{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cue{font-size:14.5px;line-height:1.55}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:42px;border:0;background:var(--surface);font-size:13.5px;font-weight:600;color:var(--muted);padding:0 4px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--plumb);color:var(--on-plumb)}
.up{background:var(--good-soft);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45}
.up b{color:var(--good)}
.sets{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:minmax(0,1fr) auto 50px;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.set.done{background:var(--plumb-soft);border-color:transparent}
.set.running{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.set-lbl{font-weight:600;font-size:14px;line-height:1.25;min-width:0}
.set-lbl small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.set-lbl .link-btn{padding:4px 0 0;font-size:13px}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:36px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;font-weight:600;line-height:1}
.stepper output{min-width:42px;text-align:center;font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.ok{width:50px;height:44px;border-radius:12px;border:2px solid var(--plumb);background:transparent;color:var(--plumb);display:grid;place-items:center}
.ok[aria-pressed="true"]{background:var(--plumb);color:var(--on-plumb)}
.rest{display:flex;flex-direction:column;gap:8px}
.rest-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rest-top .eyebrow{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rest-t{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.rest-bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.rest-bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .25s linear}
.rest-btns{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.stats b{display:block;font:700 42px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--muted)}

/* Routine guidée */
.how{font-size:16px;line-height:1.55}
.ring-wrap{position:relative;width:min(240px,68vw);aspect-ratio:1;max-width:100%;margin:6px auto 0}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring-bg{fill:none;stroke:var(--line);stroke-width:10}
.ring-fg{fill:none;stroke:var(--plumb);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.is-rest .ring-fg{stroke:var(--accent)}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
.ring-n{font:700 76px/1 var(--f-display);font-variant-numeric:tabular-nums}
.ring-l{font-weight:600;color:var(--muted);font-size:14px;margin-top:4px;line-height:1.3}
.center{text-align:center;align-items:center}

/* Suivi */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.field>span em{font-style:normal;font-weight:500}
.field small{color:var(--muted);font-size:12px;line-height:1.35}
input,textarea,select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 16px/1.3 var(--f-body);padding:10px 12px}
textarea{min-height:72px;resize:vertical}
input[type="checkbox"]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--plumb);flex:none}
.check-line{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:500}
.mgroup{display:flex;flex-direction:column;gap:10px}
.mgroup h3{font:700 19px/1.1 var(--f-display)}

function insights() {
  const L = S.measures.list; if (L.length < 2) return [];
  const out = [];
  const series = (k) => L.filter((m) => m[k] != null);
  const delta = (k) => { const s = series(k); return s.length >= 2 ? s[s.length - 1][k] - s[0][k] : null; };
  const dh = delta('hanches'); const dt = delta('taille');
  if (dh != null && dh >= 0.5 && (dt == null || Math.abs(dt) <= 0.5)) out.push(['good', `Hanches +${fmtN(dh)} cm, taille stable : tu gagnes du muscle aux fessiers.`]);
  const w = series('poids');
  if (w.length >= 2) {
    const days = dayDiff(parseKey(w[0].date), parseKey(w[w.length - 1].date));
    const perMonth = days > 0 ? (w[w.length - 1].poids - w[0].poids) / (days / 30.4) : 0;
    if (days >= 21 && perMonth > 1) out.push(['warn', `Poids +${fmtN(perMonth)} kg par mois : surplus trop grand, retire la collation.`]);
    const w3 = w.slice(-3);
    if (w3.length === 3 && dayDiff(parseKey(w3[0].date), parseKey(w3[2].date)) >= 14 && Math.abs(w3[2].poids - w3[0].poids) < 0.2) out.push(['tip', "Poids stable depuis 3 semaines : ajoute une collation d'environ 250 kcal."]);
  }
  const docc = delta('occ');
  if (docc != null && docc < 0) out.push(['good', `Distance tête-mur ${fmtN(docc)} cm : la correction de posture fonctionne.`]);
  const pp = series('pompes').slice(-3);
  if (pp.length === 3 && pp[2].pompes <= pp[0].pompes) out.push(['tip', 'Pompes stables sur 3 mesures : vérifie sommeil et protéines, puis passe à la variante suivante.']);
  const fat = series('fatigue');
  if (fat.length >= 2 && fat[fat.length - 1].fatigue < fat[0].fatigue) out.push(['good', `Fatigue debout : ${fmtN(fat[0].fatigue, 0)} puis ${fmtN(fat[fat.length - 1].fatigue, 0)} sur 10.`]);
  return out;
}
function chartSVG(pts, c) {
  const W = 300; const H = 104; const L = 6; const R = 8; const T = 10; const B = 20;
  const xs = pts.map((p) => +p.x); const x0 = Math.min(...xs); let x1 = Math.max(...xs); if (x1 === x0) x1 = x0 + 864e5;
  const ys = pts.map((p) => p.y); let y0 = Math.min(...ys); let y1 = Math.max(...ys); const span = y1 - y0; const padY = span > 0 ? span * 0.3 : Math.max(1, Math.abs(y1) * 0.05); y0 -= padY; y1 += padY;
  const X = (v) => L + ((v - x0) / (x1 - x0)) * (W - L - R);
  const Y = (v) => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const base = H - B;
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(+p.x).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
  const lp = pts[pts.length - 1];
  const area = `${d} L${X(+lp.x).toFixed(1)} ${base} L${X(+pts[0].x).toFixed(1)} ${base} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.t)} : de ${fmtN(pts[0].y)} à ${fmtN(lp.y)} ${esc(c.u)}">
    <line class="c-grid" x1="${L}" x2="${W - R}" y1="${base}" y2="${base}"/>
    <path class="c-area" d="${area}"/><path class="c-line" d="${d}"/>
    ${pts.slice(0, -1).map((p) => `<circle class="c-pt" cx="${X(+p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.6"/>`).join('')}
    <circle class="c-end" cx="${X(+lp.x).toFixed(1)}" cy="${Y(lp.y).toFixed(1)}" r="5"/>
    <text class="c-txt" x="${L}" y="${H - 5}">${esc(fmtShort(pts[0].x))}</text><text class="c-txt" x="${W - R}" y="${H - 5}" text-anchor="end">${esc(fmtShort(lp.x))}</text>
  </svg>`;
}

function progGuide() {
  const P = progInfo(); const cw = P.before ? 0 : P.cw;
  const row = (lo, hi, a, b, c, d) => `<tr class="${cw >= lo && cw <= hi ? 'cur' : ''}"><td class="num">${a}</td><td>${b}</td><td>${c}</td><td>${d}</td></tr>`;
  return `<p><b>3 séances de 50 min par semaine, en alternant A et B, plus 5 min de posture chaque matin.</b> L'appli calcule les séries de la semaine pour toi.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Semaines</th><th>Phase</th><th>Séries</th><th>Effort</th></tr></thead><tbody>
  ${row(1, 2, '1-2', 'Fondations', '2', 'RR 3')}${row(3, 4, '3-4', 'Fondations', '3', 'RR 3')}${row(5, 7, '5-7', 'Construction', '3, et 4 pour hip thrust et split squat', 'RR 2')}${row(8, 8, '8', 'Décharge', 'Moitié', 'RR 4')}${row(9, 12, '9-12', 'Intensification', '3, et 4 pour les 4 exercices de jambes', 'RR 1-2')}
  </tbody></table></div>
  <p class="small muted">Exercices de posture, de tronc et de mollets : 2 séries (1 en décharge). Après la semaine 12 : une semaine de décharge, puis un nouveau cycle depuis les variantes plus difficiles.</p>
  <h3>Lire une séance</h3>
  <ul class="plain"><li><b>3 × 8-12</b> : 3 séries de 8 à 12 répétitions. « /jambe » : de chaque côté.</li><li><b>Tempo</b>, en secondes : descente, pause en bas, montée, pause en haut. 3-1-1-0 = 3 s pour descendre, 1 s de pause, 1 s pour monter.</li><li><b>RR</b>, répétitions en réserve : combien de répétitions propres tu pourrais encore faire. Jamais jusqu'à l'échec.</li></ul>
  <h3>Règle de progression</h3>
  <ol class="plain"><li>Haut de la fourchette à toutes les séries, technique propre, deux séances de suite : monte d'un cran. L'appli te le signale.</li><li>Un cran, dans cet ordre : descente en 4 à 5 s ou pause de 2 s en bas ; sinon la version plus difficile. Si un jour tu as des haltères : +1 à 2 kg d'abord.</li><li>Après chaque cran, repars du bas de la fourchette.</li><li>Gainage : +5 s par séance jusqu'à 60 s. Sauts : 3 × 10, puis 3 × 15, puis sur un pied.</li></ol>
  <h3>Pour tenir sur la durée</h3>
  <ul class="plain"><li>Séance ratée : reprends où tu en étais, sans rattraper.</li><li>Ne saute jamais deux séances de suite.</li><li>Semaine d'examens : active « Semaine chargée » pour des séances express de 25 min (exercices 2, 3 et 4, 2 séries chacun).</li><li>Nuit de moins de 5 h : séance express ou routine posture seule.</li><li>Séance C (25 min, le samedi) : à partir de la semaine 5, seulement après une nuit d'au moins 6 h.</li></ul>`;
}

function diagGuide() {

  <div class="tbl-wrap"><table><thead><tr><th>Zone</th><th>Trop tendus : à relâcher</th><th>Faibles : à renforcer</th></tr></thead><tbody>

  <tr><td>Épaules</td><td>Grand et petit pectoral, grand dorsal, subscapulaire</td><td>Rotateurs externes (infra-épineux, petit rond), dentelé antérieur</td></tr>

  <ol class="plain"><li>Relâcher ce qui tire vers l'avant : pectoraux, trapèze supérieur, fléchisseurs de hanche.</li><li>Rendre de la mobilité au haut du dos, en extension et en rotation.</li><li>Réveiller les muscles faibles : rentrer le menton, Y au sol, glissés au mur.</li><li>Les renforcer avec charge : environ 2 séries pour le dos pour 1 série de poussée.</li><li>Changer la journée : poste de travail et micro-pauses. C'est la moitié du résultat.</li></ol>
  <p><b>La bosse de bison</b> a deux parts possibles. La part posturale, le haut du dos arrondi, s'améliore avec ce programme en 2 à 4 mois. Un coussinet graisseux ne fond pas avec des exercices ciblés ; s'il grossit, vois les signaux d'alerte.</p>`;

  <ul class="plain"><li><b>Protéines</b> : 1,6 à 2 g par kg et par jour, en 25 à 30 g à chaque repas ou collation.</li><li><b>Calories</b> : maintien estimé à ${fmtN(mLo, 0)} à ${fmtN(mHi, 0)} kcal (171 cm, vingtaine, 3 séances). Pour prendre du muscle, ajoute 200 à 300 kcal.</li><li><b>Réglage sans compter</b> : pèse-toi le dimanche à jeun et vise +0,25 à 0,5 kg par mois. Stable 3 semaines : ajoute une collation d'environ 250 kcal. Plus de 1 kg par mois : retire-la.</li><li><b>Eau</b> : 1,5 à 2 L par jour, plus les jours de séance.</li><li><b>Os</b> : 2 à 3 produits laitiers par jour, sardines mangées avec les arêtes, feuilles de nébéday dans les sauces.</li></ul>

  <h3>Ce que ça change</h3>

}
function alertGuide() {
  return `<p><b>Arrête la séance et consulte si l'un de ces signes apparaît.</b> Les courbatures 24 à 72 h après une séance, sans douleur d'articulation, sont normales, surtout les 2 premières semaines.</p>
  <h3>Consulter en urgence</h3>

  <h3>Consulter dans les jours qui suivent</h3>
  <ul class="plain"><li>Douleur du cou qui descend dans le bras, fourmillements, engourdissement ou faiblesse de la main.</li><li>Douleur du dos qui descend sous le genou.</li><li>Douleur vive d'une articulation (épaule, genou) avec gonflement, craquement douloureux ou blocage.</li><li>Douleur qui dure plus de 72 h ou qui augmente de séance en séance.</li><li>Douleur précise sur un os (tibia, pied, hanche) qui augmente avec les sauts : arrête les sauts, possible fracture de fatigue.</li><li>Règles qui deviennent irrégulières ou s'arrêtent : souvent un apport d'énergie trop bas pour l'effort.</li><li>Fatigue anormale, essoufflement au moindre effort, pâleur : faire vérifier une anémie.</li><li>Bosse de la nuque molle qui grossit, avec visage plus rond, prise de poids sur le tronc ou vergetures larges et violacées : faire un bilan, ce n'est plus une question de posture.</li></ul>`;
}
function femmesGuide() {
  return `<p><b>Les principes de la musculation sont les mêmes pour les femmes et pour les hommes</b> : en proportion, les femmes gagnent autant de muscle et de force. Ce qui change, ce sont les objectifs et quelques points de santé.</p>
  <h3>La séance F et le cardio</h3>
  <ul class="plain"><li><b>Séance F</b> (onglet Séances, 40 min) : squat sumo, fente croisée, pont en marche, dips, fire hydrant, élévations latérales, coquillage, adducteurs, dead bug et ascenseur du périnée. Elle cible ce que les programmes classiques oublient : côté des hanches, intérieur des cuisses, arrière des bras, ventre sans crunch et périnée. Fais-la en plus de A et B, ou à la place de C.</li><li><b>Cardio</b> : 4 séances guidées, dont une sans aucun saut (périnée et genoux protégés) et une sur ta musique. Vise 150 minutes par semaine ; l'appli les compte.</li><li><b>Énergie du jour</b> : sur l'accueil, dis si tu es fatiguée, si tu as peu dormi ou si tes règles sont douloureuses : la séance passe toute seule en express et en version facile.</li></ul>
  <h3>Pensé pour le corps des femmes</h3>
  <ul class="plain"><li><b>Périnée</b> : à chaque effort, tu expires en serrant le périnée (comme pour retenir un pipi), sans bloquer ta respiration. Pas de relevés de buste (crunchs), qui poussent les organes vers le bas : le gainage, le bird-dog et le pull-over au sol travaillent les abdominaux profonds à la place.</li><li><b>Bassin plus large</b> : les genoux ont tendance à rentrer vers l'intérieur. Les consignes rappellent de garder le genou au-dessus du 2e orteil, on préfère les fentes arrière, et le moyen fessier (abduction, marche latérale avec mini-bande) est travaillé à chaque séance B.</li><li><b>Poitrine</b> : chaque exercice à plat ventre a une version debout ou penchée (élastique, haltères). Pour les sauts, une brassière bien maintenue.</li><li><b>Haut du corps</b> : la progression part de là où tu en es (mur, table, genoux, sol ; développé au sol avec haltères ; tirage à l'élastique qui prépare la traction).</li><li><b>Grossesse et après l'accouchement</b> : demande l'avis d'une sage-femme ou d'un médecin. Après un accouchement, la rééducation du périnée passe avant les sauts et les charges ; un ventre en « dôme » pendant l'effort (diastasis) demande des versions plus faciles.</li></ul>
  <h3>Ce qui a changé dans ton programme</h3>
  <ul class="plain"><li>Fessiers travaillés à chaque séance, avec plusieurs exercices : aucun exercice ne cible à lui seul toutes les parties des fessiers.</li><li>Deux exercices de fin de séance, populaires sur TikTok et efficaces sans matériel : les frog pumps (séances A et C) et les kickbacks à quatre pattes (séance B).</li><li>Séries longues de 15 à 30 répétitions avec des repos courts : les femmes se fatiguent en général moins vite d'une série à l'autre.</li><li>Les pompes commencent en version facile (contre le mur, puis à genoux), car la force du haut du corps est souvent plus basse au départ. Passe à la version standard quand tu atteins le haut de la fourchette deux séances de suite.</li></ul>
  <h3>Ce qu'on a gardé de TikTok, et ce qu'on a laissé</h3>
  <ul class="plain"><li><b>Gardé</b> : pont fessier, frog pumps, kickbacks, fentes, soulevé de terre sur une jambe, abduction de hanche. Ce sont aussi les exercices que recommandent les entraîneurs.</li><li><b>Laissé</b> : les séances fessiers tous les jours (le muscle grossit pendant le repos), les défis de 30 jours qui promettent des résultats rapides, et les exercices censés faire fondre la graisse d'une seule zone, ce qui ne marche pas.</li><li>Les entraîneurs mettent aussi en garde : se focaliser sur une seule partie du corps peut mener à des habitudes malsaines. Ton objectif reste la force, la posture et la santé.</li></ul>
  <h3>Cycle menstruel</h3>
  <ul class="plain"><li>Les études ne montrent pas d'intérêt à changer le programme selon la phase du cycle : les phases varient trop d'une femme à l'autre et d'un mois à l'autre.</li><li>Adapte plutôt selon ce que tu ressens : séance normale, version express, ou routine posture seule les jours difficiles. Note tes règles sur l'écran Aujourd'hui.</li><li>Bouger un peu peut soulager les crampes.</li><li>Règles très douloureuses, très abondantes, irrégulières ou qui s'arrêtent : parles-en à un médecin.</li></ul>
  <h3>Fer</h3>
  <ul class="plain"><li>Les règles font perdre du fer, et le manque de fer est fréquent chez les jeunes femmes : fatigue, essoufflement, moins de force.</li><li>Aliments riches en fer : foie, viande rouge, poisson, sardines, niébé, feuilles de nébéday.</li><li>Ajoute au repas un fruit riche en vitamine C (orange, citron, goyave), qui aide à absorber le fer.</li><li>Évite le thé et l'ataya pendant les repas : ils réduisent l'absorption du fer.</li></ul>
  <h3>Os et périnée</h3>
  <ul class="plain"><li>Les femmes perdent plus de masse osseuse en vieillissant, surtout après la ménopause. Les sauts et le renforcement d'aujourd'hui sont ta meilleure protection, avec le calcium (lait, lait caillé, sardines avec les arêtes) et le soleil pour la vitamine D.</li><li>Si tu as des fuites d'urine en sautant, en toussant ou en portant une charge, remplace les sauts par les montées sur la pointe des pieds et parles-en à une sage-femme ou à un médecin.</li></ul>
  <p class="small muted">Sources : <a href="https://www.frontiersin.org/articles/10.3389/fspor.2023.1054542/full" target="_blank" rel="noopener">revue Frontiers 2023 sur le cycle menstruel et la musculation</a> ; <a href="https://www.planetfitness.com/newsroom/news/whats-behind-this-glutemaxxing-or-bootymaxxing-trend" target="_blank" rel="noopener">Planet Fitness sur la tendance « glutemaxxing »</a> ; <a href="https://central.gymshark.com/article/best-bodyweight-glute-exercises" target="_blank" rel="noopener">Gymshark, exercices fessiers au poids du corps</a>.</p>`;
}

function pQueue(d) {
  const q = WARMUP.map((w, i) => ({ k: 'warm', i }));
  buildSteps(d.type, d.express, d.cw, d.eq || 'aucun').forEach((st, si) => {
    if (st.kind !== 'ex') return;
    const max = Math.max(...st.ex.map((e) => e.sets));
    for (let i = 0; i < max; i++) st.ex.forEach((e) => { if (i < e.sets) q.push({ k: 'set', si, e, i, sup: st.ex.length > 1 ? st.ex.filter((x) => x.id !== e.id).map((x) => EX[x.id].name) : null }); });

}

  RT.warm = null; RT.hold = null;
  const it = q[d.qi];

    if (!nx || nx.k === 'end') rest = 0;

}

function tickSession(now) {
  const d = S.draft; if (!d || UI.overlay !== 'session') return;
  const e1 = document.getElementById('elapsed'); if (e1) e1.textContent = fmtMS(now - d.startedAt);
  const e2 = document.getElementById('elapsed2'); if (e2) e2.textContent = fmtMS(now - d.startedAt);
  if (!UI.detail) { tickPlayer(now); return; }
  if (RT.rest) {
    const rem = RT.rest.until - now;
    if (rem <= 0) { RT.rest = null; chime('end'); renderFoot(); toast('Repos terminé : série suivante'); }
    else {
      if (!RT.rest.warned && rem <= 3000) { RT.rest.warned = true; chime('tick'); }
      const t = document.getElementById('restT'); if (t) t.textContent = fmtMS(rem);
      const bar = document.getElementById('restBar'); if (bar) bar.style.width = `${Math.max(0, Math.min(100, (rem / RT.rest.total) * 100))}%`;
    }
  }
  if (RT.hold) {
    const s = Math.floor((now - RT.hold.start) / 1000);
    const o = document.getElementById(`v-${RT.hold.ex}-${RT.hold.i}`); if (o) o.textContent = s;
    const tg = d.entries[RT.hold.ex] && d.entries[RT.hold.ex].target;
    if (tg) { if (!RT.hold.b1 && s >= tg.lo) { RT.hold.b1 = true; chime('tick'); } if (!RT.hold.b2 && s >= tg.hi) { RT.hold.b2 = true; chime('end'); } }
  }
}
function tickGuided(now) {
  if (!GP || GP.done || GP.paused || UI.overlay !== 'guided') return;
  if (now >= GP.segEnd) { gpAdvance(); return; }
  const sg = GP.list[GP.i].segs[GP.j]; const rem = GP.segEnd - now;
  const t = document.getElementById('gpT'); if (t) t.textContent = Math.ceil(rem / 1000);
  const ring = document.getElementById('gpRing'); if (ring) ring.setAttribute('stroke-dashoffset', (RING_C * (1 - rem / (sg.s * 1000))).toFixed(1));
}
function tickStudy(now) {
  const st = S.study; if (!st || !st.until || st.fired) return;
  if (now >= st.until) {
    st.fired = true; saveLocal(); chime('alarm');
    if (UI.overlay === 'session') toast("C'est l'heure de ta micro-pause");
    else if (UI.overlay !== 'guided') gpStart('pause');
    render(); wakeSync(); return;
  }
  const el = document.getElementById('studyLeft'); if (el) el.textContent = fmtMS(st.until - now);
}
let lastDay = keyOf();
function tick() {
  const now = Date.now();

  const k = keyOf(); if (k !== lastDay) { lastDay = k; render(); }

/* ---------- Énergie du jour : la séance s'adapte toute seule ---------- */
const MOODS = [['forme', 'En forme'], ['fatigue', 'Fatiguée'], ['sommeil', 'Nuit courte'], ['regles', 'Règles douloureuses']];
const moodOf = () => getHab(keyOf()).mood || '';
const moodLight = () => ['fatigue', 'sommeil', 'regles'].includes(moodOf());
function isBusy(type) { return type !== 'C' && type !== 'F' && (!!S.settings.busy || moodLight()); }
function moodHTML() {
  const m = moodOf();
  const note = m === 'regles' ? 'Séance express en version facile, sans sauts. Bouger un peu soulage souvent les crampes.' : m === 'fatigue' || m === 'sommeil' ? 'Séance express de 25 min : tu gardes le rythme sans t\'épuiser.' : m === 'forme' ? 'Séance complète. Profites-en pour viser le haut de la fourchette.' : 'Touche ce qui te correspond : la séance s\'adapte toute seule.';
  return `<div class="field"><span>Aujourd'hui, je suis</span><div class="chips eq-chips" role="group" aria-label="Énergie du jour">${MOODS.map(([k, l]) => `<button class="chip" data-action="mood" data-k="${k}" aria-pressed="${m === k}">${esc(l)}</button>`).join('')}</div><small>${esc(note)}</small></div>`;
}

let VOICE = null;
function frVoice() { try { const vs = window.speechSynthesis.getVoices(); return vs.find((v) => /^fr/i.test(v.lang) && /google|natural|premium|enhanced/i.test(v.name)) || vs.find((v) => /^fr/i.test(v.lang)) || null; } catch (e) { return null; } }
try { if ('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = () => { VOICE = frVoice(); }; } catch (e) { /* rien */ }
function say(txt) {
  if (!S.settings.voice || S.settings.mute || !('speechSynthesis' in window)) return;
  try { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang = 'fr-FR'; const v = VOICE || (VOICE = frVoice()); if (v) u.voice = v; u.rate = 1.03; window.speechSynthesis.speak(u); } catch (e) { /* voix indisponible */ }
}
const sideSay = (ex) => (!ex.side ? '' : ex.side.includes('jambe') ? ' par jambe' : ex.side.includes('bras') ? ' par bras' : ex.side.includes('pas') ? ' pas' : ' par côté');
function pAnnounce() {
  const d = S.draft; if (!d) return; const q = pQueue(d); const it = q[d.qi]; if (!it) return;
  if (RT.rest) { const t = pItemTitle(it); say(`Repos. Ensuite : ${t.name}.`); return; }

/* ---------- Tempo guidé : l'appli compte chaque répétition au bon rythme ---------- */
const TP = { on: false, timers: [], ex: null, i: 0 };
const tempoParse = (s) => { const m = String(s).match(/^(\d)-(\d)-(\d)-(\d)$/); return m ? m.slice(1).map(Number) : null; };
function tempoStop() { TP.timers.forEach(clearTimeout); TP.timers = []; TP.on = false; }
function tempoStart(id, i) {
  const ex = EX[id]; const tp = tempoParse(ex.tempo); const d = S.draft; if (!tp || !d) return;
  tempoStop(); TP.on = true; TP.ex = id; TP.i = i;
  const target = d.entries[id].target.hi; let t = 1600; const at = (ms, fn) => TP.timers.push(setTimeout(fn, ms));
  say(`Tempo ${tp.join(', ')}. Je compte pour toi.`);
  for (let r = 1; r <= target; r++) {
    for (let s = 0; s < tp[0]; s++) { at(t, () => beep(392, 0.09, 0, 0.14)); t += 1000; }
    for (let s = 0; s < tp[1]; s++) { at(t, () => beep(330, 0.06, 0, 0.08)); t += 1000; }
    at(t, () => beep(784, 0.16, 0, 0.2)); t += Math.max(1, tp[2]) * 1000;
    t += tp[3] * 1000;
    const rr = r; at(t - 250, () => { const en = S.draft && S.draft.entries[id]; if (en) en.sets[i] = rr; const o = document.getElementById(`v-${id}-${i}`); if (o) o.textContent = rr; say(String(rr)); });
  }
  at(t + 300, () => { tempoStop(); chime('end'); say('Série terminée. Touche Fini.'); renderOverlay({ keep: true }); });
  renderOverlay({ keep: true });
}

/* ---------- Révise pendant tes repos : tes cartes XamXam, ou les triades ---------- */
const RV = { card: null, shown: false };
function xxCards() {
  try { const d = JSON.parse(localStorage.getItem('xamxam.v1') || 'null'); if (!d || !d.cards) return [];
    return Object.values(d.cards).filter((c) => c && !c.suspended && (c.type === 'qa' || c.type === 'cloze') && c.front && String(c.front).length < 600); } catch (e) { return []; }

}

}

/* ---------- Caméra : photo d'aplomb et miroir ---------- */
const CAM = { stream: null, iv: null };
const camOK = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
function camStop() { if (CAM.iv) { clearInterval(CAM.iv); CAM.iv = null; } if (CAM.stream) { CAM.stream.getTracks().forEach((t) => t.stop()); CAM.stream = null; } }
function camAttach() { const v = document.getElementById('camV'); if (v && CAM.stream && v.srcObject !== CAM.stream) { v.srcObject = CAM.stream; v.play().catch(() => {}); } }
async function camStart() {
  camStop();
  try { CAM.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: UI.cam.facing, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false }); UI.cam.err = ''; camAttach(); }
  catch (e) { if (UI.cam) { UI.cam.err = "Caméra indisponible : autorise l'accès à la caméra pour Aplomb dans ton navigateur."; renderOverlay({ keep: true }); } }
}
function camOpen(mode, ex) {
  if (!camOK()) { toast("Ton navigateur ne donne pas accès à la caméra."); return; }
  UI.cam = { mode, ex: ex || null, facing: 'user', count: 0, err: '', back: UI.overlay === 'preview' ? 'preview' : null };
  UI.overlay = 'camera'; renderOverlay(); camStart();
}
function camClose() { camStop(); const back = UI.cam && UI.cam.back; UI.cam = null; if (back === 'preview' && UI.prev) { UI.overlay = 'preview'; renderOverlay({ keep: true }); } else closeOverlay(); }
function ovCamera() {
  const c = UI.cam; if (!c) return ''; const photo = c.mode === 'photo'; const ex = c.ex ? EX[c.ex] : null;
  return `<header class="ov-head"><div class="wrap"><div class="ov-row"><div class="ov-title"><p class="eyebrow">${photo ? "Photo d'aplomb · reste sur ton téléphone" : "Miroir · rien n'est enregistré"}</p><h2>${photo ? 'De profil, bras le long du corps' : esc(ex ? ex.name : 'Miroir')}</h2></div><button class="icon-btn" data-action="cam-close" aria-label="Fermer">${ICON.x}</button></div></div></header>
  <div class="ov-body"><div class="wrap stack">
    <div class="cam-wrap"><video id="camV" playsinline muted autoplay class="${c.facing === 'user' ? 'mir' : ''}"></video>
      ${photo ? '<div class="plumb"><i></i><b></b></div>' : `<div class="cam-fig">${figHTML(c.ex, 'sm')}</div>`}
      <div class="cam-count" id="camCount">${c.count || ''}</div></div>
    ${c.err ? `<p class="small" style="color:var(--crit)">${esc(c.err)}</p>` : `<p class="small muted">${photo ? "Pose le téléphone à hauteur de hanche, à 2 ou 3 m, et mets-toi de profil. Place ta cheville sur la ligne : l'oreille, l'épaule, la hanche et le genou devraient tomber dessus. Une photo toutes les 4 semaines suffit pour voir tes progrès." : 'Pose le téléphone face à toi, fais le mouvement et compare-toi au dessin en haut à droite. La vidéo reste sur ton téléphone, rien n\'est enregistré ni envoyé.'}</p>`}
  </div></div>
  <footer class="ov-foot"><div class="wrap"><div class="btn-row"><button class="btn" data-action="cam-flip">Changer de caméra</button>${photo ? `<button class="btn primary" data-action="cam-timer">${c.count ? 'Photo dans ' + c.count + ' s…' : 'Photo dans 10 s'}</button>` : ''}</div></div></footer>`;
}
function camShot() {
  const v = document.getElementById('camV'); if (!v || !v.videoWidth) { toast('La caméra n\'est pas prête.'); return; }
  const k = Math.min(1, 960 / Math.max(v.videoWidth, v.videoHeight)); const W = Math.round(v.videoWidth * k); const H = Math.round(v.videoHeight * k);
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  if (UI.cam.facing === 'user') { g.translate(W, 0); g.scale(-1, 1); }
  g.drawImage(v, 0, 0, W, H); g.setTransform(1, 0, 0, 1, 0, 0);
  g.strokeStyle = '#EE8458'; g.lineWidth = Math.max(2, W / 260); g.beginPath(); g.moveTo(W / 2, 0); g.lineTo(W / 2, H); g.stroke();
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, H - 34, W, 34); g.fillStyle = '#fff'; g.font = '600 17px sans-serif'; g.fillText('Aplomb · ' + fmtDate(new Date()), 12, H - 11);
  chime('end');
  c.toBlob(async (b) => { if (!b) return; try { await phPut({ id: Date.now().toString(36), t: Date.now(), blob: b }); toast("Photo d'aplomb enregistrée sur ton téléphone"); } catch (e) { toast("Enregistrement impossible sur ce navigateur."); } camStop(); UI.cam = null; UI.overlay = null; renderOverlay(); UI.tab = 'suivi'; render(); window.scrollTo(0, 0); }, 'image/jpeg', 0.8);
}
const PH = { db: null, urls: [] };
function phDB() { return new Promise((res, rej) => { if (PH.db) { res(PH.db); return; } const r = indexedDB.open('aplomb-photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p', { keyPath: 'id' }); r.onsuccess = () => { PH.db = r.result; res(PH.db); }; r.onerror = () => rej(r.error); }); }
async function phAll() { const db = await phDB(); return new Promise((res, rej) => { const q = db.transaction('p').objectStore('p').getAll(); q.onsuccess = () => res((q.result || []).sort((a, b) => a.t - b.t)); q.onerror = () => rej(q.error); }); }
async function phPut(o) { const db = await phDB(); return new Promise((res, rej) => { const tx = db.transaction('p', 'readwrite'); tx.objectStore('p').put(o); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function phDel(id) { const db = await phDB(); return new Promise((res, rej) => { const tx = db.transaction('p', 'readwrite'); tx.objectStore('p').delete(id); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function photoFill() {
  const el = document.getElementById('photoBox'); if (!el) return;
  let list = []; try { list = await phAll(); } catch (e) { el.innerHTML = '<p class="small muted">Les photos ne peuvent pas être gardées sur ce navigateur.</p>'; return; }
  PH.urls.forEach((u) => URL.revokeObjectURL(u)); PH.urls = [];
  const url = (p) => { const u = URL.createObjectURL(p.blob); PH.urls.push(u); return u; };
  const fig = (p, cap) => `<figure><img src="${url(p)}" alt="${esc(cap)}"><figcaption>${esc(cap)}</figcaption></figure>`;
  if (!list.length) { el.innerHTML = '<p class="small muted">Pas encore de photo. La première sert de point de départ.</p>'; return; }

    + `<details class="p-how"><summary>Toutes tes photos (${list.length})</summary><div class="ph-grid">${list.map((p) => `<figure><img src="${url(p)}" alt=""><figcaption>${esc(fmtShort(new Date(p.t)))} · <button class="link-btn danger" data-action="ph-del" data-id="${p.id}">Supprimer</button></figcaption></figure>`).join('')}</div></details>`;
}
function photoCard() {
  return `<section class="card"><div><p class="eyebrow">Photo d'aplomb</p><h2>Ta ligne d'aplomb</h2></div>
    <p class="small muted">De profil, une ligne verticale doit passer par l'oreille, l'épaule, la hanche, le genou et la cheville. L'appli trace la ligne pour toi et compare ta première photo à la dernière. Les photos restent sur ton téléphone.</p>

/* ---------- Séances : musculation, séance F, cardio ---------- */
function weekStart(d = new Date()) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); }
function cardioWeek() { const s = weekStart(); let m = 0; for (let i = 0; i < 7; i++) m += getHab(keyOf(addDays(s, i))).cardio || 0; return m; }
const sessMins = (t) => (isBusy(t) ? 25 : t === 'C' ? 25 : t === 'F' ? 40 : 50);
function viewSeances() {
  const P = progInfo(); const cw = P.before ? 1 : P.cw; const cm = cardioWeek();
  const card = (t, badge) => { const steps = buildSteps(t, isBusy(t), cw); const n = steps.filter((x) => x.kind === 'ex').reduce((a, x) => a + x.ex.length, 0);
    return `<article class="card${t === 'F' ? ' feature' : ''}"><div class="sess-top"><div><p class="eyebrow">${esc(badge)}</p><h2>${esc(PLAN[t].name)}</h2><p class="small muted">${esc(PLAN[t].focus)}</p></div><span class="sess-letter" aria-hidden="true">${t}</span></div>
      <p class="meta-line"><span>${ICON.timer}${sessMins(t)} min</span><span>${n} exercices</span></p>
      <div class="btn-row"><button class="btn" data-action="preview" data-type="${t}">Aperçu</button><button class="btn primary" data-action="start-session" data-type="${t}">${S.draft && S.draft.type === t ? 'Reprendre' : 'Lancer'}</button></div></article>`; };
  const uniq = (steps) => steps.filter((s) => !s.segs.every((g) => g.rest)).filter((s, i, a) => a.findIndex((x) => (x.mv || x.t) === (s.mv || s.t)) === i);
  return `<div class="stack">
  <section class="sec-head"><p class="eyebrow">Séances</p><h1 class="h1">Bouger</h1><p class="lead">Musculation pensée pour les femmes et cardio. Regarde les exercices avant de te lancer, rien ne démarre tant que tu n'as pas touché « Lancer ».</p></section>
  <section class="card">${eqChips()}${moodHTML()}</section>
  <h2 class="list-h">Musculation</h2>
  ${card('F', 'Nouveau · pensée pour les femmes')}${card('A', 'Ton programme · séance A')}${card('B', 'Ton programme · séance B')}${card('C', 'Posture · 25 min')}

    <p class="small muted">L'OMS conseille 150 minutes de cardio modéré par semaine (essoufflée mais capable de parler), ou 75 minutes intenses. Les minutes s'ajoutent toutes seules à la fin de chaque séance.</p></section>
  ${Object.entries(CARDIO).map(([id, c]) => `<article class="card"><div><p class="eyebrow">${esc(c.tag)} · ${c.mins} min</p><h2>${esc(c.name)}</h2><p class="small">${esc(c.desc)}</p></div>
    <details class="p-how"><summary>Voir les mouvements</summary><ol class="ex-list">${uniq(c.steps).map((s) => `<li>${figHTML(s.fig, 'sm')}<div class="ex-li-b"><span class="ex-li-name">${esc(s.t)}</span><span class="muted small">${esc(s.how)}</span>${demoBtnHTML(s.mv || s.fig)}</div><span></span></li>`).join('')}</ol></details>
    <button class="btn primary block" data-action="cardio-start" data-id="${id}">Lancer · ${c.mins} min</button></article>`).join('')}
  </div>`;
}

function applyTheme() { const th = S.settings.theme || 'auto'; if (th === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', th); }
/* ---------- Bilan de la semaine et trophées ---------- */
function weekSummary() {
  const s = weekStart(); let post = 0, prot = 0, eau = 0, cardio = 0; const keys = [];
  for (let i = 0; i < 7; i++) { const k = keyOf(addDays(s, i)); keys.push(k); const h = getHab(k); if (h.posture) post++; if (h.prot) prot++; if ((h.eau || 0) >= 8) eau++; cardio += h.cardio || 0; }
  const sess = Object.values(S.sessions).filter((x) => keys.includes(x.date)).length;
  return { sess, post, prot, eau, cardio };
}
function trophies() {
  const all = Object.values(S.sessions); const days = S.habits.days; const vals = Object.values(days);
  const postDays = vals.filter((h) => h.posture).length; const eauDays = vals.filter((h) => (h.eau || 0) >= 8).length;
  const byWeek = {}; Object.entries(days).forEach(([k, h]) => { if (h.cardio) { const w = keyOf(weekStart(parseKey(k))); byWeek[w] = (byWeek[w] || 0) + h.cardio; } });
  const bestCardio = Math.max(0, ...Object.values(byWeek)); const cardioTot = vals.reduce((a, h) => a + (h.cardio || 0), 0);
  return [
    ['🌱', 'Première séance', all.length >= 1, `${Math.min(all.length, 1)}/1`],
    ['💪', '10 séances', all.length >= 10, `${Math.min(all.length, 10)}/10`],
    ['🏅', '30 séances', all.length >= 30, `${Math.min(all.length, 30)}/30`],

    ['❤️', '150 min de cardio en une semaine', bestCardio >= 150, `${Math.min(bestCardio, 150)}/150`],
    ['🏃🏾‍♀️', '10 heures de cardio', cardioTot >= 600, `${Math.min(Math.round(cardioTot / 60), 10)}/10 h`],
    ['💧', '2 L d\'eau 7 jours', eauDays >= 7, `${Math.min(eauDays, 7)}/7`],
    ['📏', '4 dimanches de mesures', S.measures.list.length >= 4, `${Math.min(S.measures.list.length, 4)}/4`],
  ];
}
function weekCard() {
  const w = weekSummary(); const tr = trophies(); const got = tr.filter((x) => x[2]).length;
  return `<section class="card"><div><p class="eyebrow">Cette semaine</p><h2>Ton bilan</h2></div>
    <div class="wk-sum"><div><b>${w.sess}</b><span>séance${w.sess > 1 ? 's' : ''} de musculation</span></div><div><b>${w.cardio} min</b><span>de cardio sur 150</span></div><div><b>${w.post}/7</b><span>routines posture</span></div><div><b>${w.eau}/7</b><span>jours à 2 L d'eau</span></div></div></section>

}
/* ---------- Démarrage ---------- */

if (saved) { ['settings', 'habits', 'measures', 'sessions', 'draft', 'study'].forEach((k) => { if (saved[k] !== undefined) S[k] = saved[k]; }); }
